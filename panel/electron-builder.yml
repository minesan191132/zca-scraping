appId: com.example.operations-panel
productName: Zalo Bots
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!scripts/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.*'
  - '!svelte.config.mjs'
  - '!components.json'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: build/default-project.json
    to: default-project.json
asarUnpack:
  - resources/**
win:
  executableName: zalo-bots
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Zalo Bots
  uninstallDisplayName: Zalo Bots
  createDesktopShortcut: always
npmRebuild: false
